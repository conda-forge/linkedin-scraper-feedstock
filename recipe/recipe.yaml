schema_version: 1

context:
  name: linkedin-scraper
  version: "3.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/joeyism/linkedin_scraper/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fa2dff943ef63d05aa9a807a913d515b0ff008088d26c02407c3d836ae896e0e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - lxml
    - python >=${{ python_min }}
    - requests
    - selenium
    - playwright-python
    - python-dotenv
    - pydantic
    - aiofiles

tests:
  - python:
      imports:
        - linkedin_scraper
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Scrapes user data from Linkedin
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/joeyism/linkedin_scraper

extra:
  recipe-maintainers:
    - jan-janssen
